name: Munchit User Engagement - Prod Backend Build and Deployment Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write
  security-events: write
  actions: read

env:
  SERVICE_TYPE: backend
  ENVIRONMENT: prod

jobs:
  build-and-deploy:
    name: Build and Deployment
    runs-on: ubuntu-latest
    environment: Prod
    outputs:
      image_tag: ${{ steps.image_tag.outputs.IMAGE_TAG }}
      deployment_file_path: ${{ steps.image_tag.outputs.DEPLOYMENT_FILE_PATH }} 
      repo_name: ${{ steps.image_tag.outputs.REPO_NAME }}
 

    steps:
      - name: "Self Checkout the Branch"
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate Image Tag and Variables
        id: image_tag
        run: |
          # Get current date in ddMMyyyy format
          CURRENT_DATE=$(date +'%d%m%Y')
          SHORT_SHA=$(git rev-parse --short=4 HEAD)
          
          # Use env.ENVIRONMENT instead of vars.Environment
          IMAGE_TAG="${{ vars.APPLICATION_NAME }}-${{ env.ENVIRONMENT }}-${CURRENT_DATE}-v1.${SHORT_SHA}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_OUTPUT

          # Create repository name (lowercase for ACR compatibility)
          REPO_NAME=$(echo "${{ vars.APPLICATION_NAME }}-${{ env.ENVIRONMENT }}-${{ env.SERVICE_TYPE }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_NAME=${REPO_NAME}" >> $GITHUB_ENV
          echo "REPO_NAME=${REPO_NAME}" >> $GITHUB_OUTPUT

          # Create deployment file path
          DEPLOYMENT_FILE_PATH="${{ env.ENVIRONMENT }}/Deployment_files/deployment.yaml"
          echo "DEPLOYMENT_FILE_PATH=${DEPLOYMENT_FILE_PATH}" >> $GITHUB_ENV
          echo "DEPLOYMENT_FILE_PATH=${DEPLOYMENT_FILE_PATH}" >> $GITHUB_OUTPUT
          
          # Debug output
          echo "✅ Generated values:"
          echo "  IMAGE_TAG: ${IMAGE_TAG}"
          echo "  REPO_NAME: ${REPO_NAME}"
          echo "  DEPLOYMENT_FILE_PATH: ${DEPLOYMENT_FILE_PATH}"

      - name: "Moving the Docker file"
        run: |
            cp -r .github/workflows/Docker_Files/* .

      - name: "Login to the Azure"
        uses: azure/login@v2
        with: 
          creds: "${{ secrets.AZURE_CREDENTIALS }}"
        
      - name: "Login to Azure Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_SERVER_URL }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: "Docker image creation and push into ACR"
        uses: docker/build-push-action@v5
        with: 
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_SERVER_URL }}/${{ env.REPO_NAME }}:${{ env.IMAGE_TAG }}
            ${{ secrets.ACR_SERVER_URL }}/${{ env.REPO_NAME }}:latest
          file: ./Dockerfile

      - name: "Configure the AKS Cluster"
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ vars.RESOURCEGROUP }}
          cluster-name: ${{ vars.CLUSTER }}

      - name: Create/Update Kubernetes Secret
        run: |
          kubectl create secret generic backend-secret \
            --namespace=${{ vars.NAMESPACE }} \
            --from-literal=FRONTEND_URL="${{ vars.FRONTEND_URL }}" \
            --from-literal=PORT="${{ vars.PORT }}" \
            --from-literal=DB_HOST="${{ secrets.DB_HOST }}" \
            --from-literal=DB_USER="${{ secrets.DB_USER}}" \
            --from-literal=DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --from-literal=DB_PORT="${{ vars.DB_PORT }}" \
            --from-literal=DB_NAME="${{ vars.DB_NAME }}" \
            --from-literal=DB_SSL="${{ vars.DB_SSL }}" \
            --from-literal=SMSAPI_BASEURL="${{ vars.SMSAPI_BASEURL }}" \
            --from-literal=SMSAPI_APIKEY="${{ vars.SMSAPI_APIKEY }}" \
            --from-literal=SMSAPI_SENDERID="${{ vars.SMSAPI_SENDERID }}" \
            --from-literal=SMSAPI_CHANNEL="${{ vars.SMSAPI_CHANNEL }}" \
            --from-literal=AZURE_STORAGE_ACCOUNT="${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
            --from-literal=AZURE_STORAGE_CONTAINER="${{ secrets.AZURE_STORAGE_CONTAINER }}" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: "Update the Image in the AKS Deployment"
        run: |
          if ! kubectl get deployment backend-deployment -n ${{ vars.NAMESPACE }} &>/dev/null; then
            echo "::error::Deployment not found in namespace ${{ vars.NAMESPACE }}"
            exit 1
          fi

          kubectl set image deployment/backend-deployment backend-container="${{ secrets.ACR_SERVER_URL }}/${{ env.REPO_NAME }}:${{ env.IMAGE_TAG }}" -n ${{ vars.NAMESPACE }}

          # Wait for rollout
          kubectl rollout status deployment/backend-deployment --namespace ${{ vars.NAMESPACE }} --timeout=5m
          

      - name: Verify Deployment
        run: |
          echo "Deployment completed successfully with image tag: ${{ env.IMAGE_TAG }}"
          kubectl get pods -n ${{ vars.NAMESPACE }} -l app=backend

  update-deployment-file:
    name: Update Deployment YAML in Repository
    runs-on: ubuntu-latest
    needs: build-and-deploy
    environment: Prod
    env:
      IMAGE_TAG: ${{ needs.build-and-deploy.outputs.image_tag }}
      DEPLOYMENT_FILE_PATH: ${{ needs.build-and-deploy.outputs.deployment_file_path }}
      REPO_NAME: ${{ needs.build-and-deploy.outputs.repo_name }}
    if: success()
    steps:
      - name: Checkout repository (with deployment files)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DEPLOYMENT_REPO_PAT }}
          repository: ${{ vars.DEPLOYMENT_REPO_NAME }}
          ref: ${{ vars.DEPLOYMENT_BRANCH_NAME}}
          path: repo-to-update
          fetch-depth: 0

      - name: Update image tag in deployment file
        run: |
          cd repo-to-update
          echo "Updating deployment with image tag: ${{ env.IMAGE_TAG }}"
          echo "Deployment file path: ${{ env.DEPLOYMENT_FILE_PATH }}"
          echo "Repository name: ${{ env.REPO_NAME }}"
          
          # Check if file exists
          if [ ! -f "${{ env.DEPLOYMENT_FILE_PATH }}" ]; then
            echo "Error: Deployment file not found at ${{ env.DEPLOYMENT_FILE_PATH }}"
            exit 1
          fi
          
          # Update the image tag in the deployment file
          sed -i "s|${{ secrets.ACR_SERVER_URL }}/${{ env.REPO_NAME }}:[^\"']*|${{ secrets.ACR_SERVER_URL }}/${{ env.REPO_NAME }}:${{ env.IMAGE_TAG }}|g" ${{ env.DEPLOYMENT_FILE_PATH }}
          
          # Show the changes
          echo "Updated deployment.yaml:"
          grep -n "image:" ${{ env.DEPLOYMENT_FILE_PATH }}
          
      - name: Validate YAML syntax
        run: |
          cd repo-to-update
          # Install yamllint if not available
          pip install yamllint --quiet || true
          yamllint ${{ env.DEPLOYMENT_FILE_PATH }} || echo "Warning: YAML linting issues found"
          
      - name: Commit and push changes
        run: |
          cd repo-to-update
          IMAGE_TAG="${{ needs.build-and-deploy.outputs.image_tag }}"
          
          # Configure git
          git config user.email "${{ vars.GIT_USER_EMAIL }}"
          git config user.name "${{ vars.GIT_USER_NAME }}"
          
          # Check if there are changes to commit
          if git diff --quiet ${{ env.DEPLOYMENT_FILE_PATH }}; then
            echo "No changes to commit"
            exit 0
          fi
          
          # Show the diff for logging
          echo "Changes to be committed:"
          git diff ${{ env.DEPLOYMENT_FILE_PATH }}
          
          # Commit and push changes
          git add ${{ env.DEPLOYMENT_FILE_PATH }}
          git commit -m "chore(deployment): update image tag to ${IMAGE_TAG}

          - Updated docker image tag to ${IMAGE_TAG}
          - Deployed version: ${{ env.IMAGE_TAG }}
          - Service: ${{ env.SERVICE_TYPE }}
          - Environment: ${{ env.ENVIRONMENT }}
          - Triggered by GitHub Actions run #${{ github.run_number }}
          
          Co-authored-by: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>"
          
          git push origin HEAD:${{ vars.DEPLOYMENT_BRANCH_NAME}}
          
      - name: Create annotation with updated tag
        if: success()
        run: |
          IMAGE_TAG="${{ needs.build-and-deploy.outputs.image_tag }}"
          echo "::notice::Deployment file updated successfully with image tag: ${IMAGE_TAG}"
          
      - name: Send notification on failure
        if: failure()
        run: |
          echo "::error::Failed to update deployment file in repository"
          echo "Please check:"
          echo "  - DEPLOYMENT_REPO_PAT secret is valid"
          echo "  - Deployment file path exists: ${{ env.DEPLOYMENT_FILE_PATH }}"
          echo "  - Repository name: ${{ vars.DEPLOYMENT_REPO_NAME }}"
          echo "  - Branch name: ${{ vars.DEPLOYMENT_BRANCH_NAME }}"
          # You can add Slack/Teams webhook notifications here if 
